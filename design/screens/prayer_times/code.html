<script type="text/babel">// lib/time.jsx
// Shared date/time utilities for Sweden Prayer.
// Pure functions — no React, no fetch, no side effects.
// Covers: Julian Date, solar position, prayer time calculation, Hijri conversion.

// ── Julian Date ──────────────────────────────────────────────────────────────
function julianDate(date) {
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  const a = Math.floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy +
    Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}

// ── Prayer time calculation (astronomical solar position) ────────────────────
// Returns { fajr, shurkuk, dhuhr, asr, maghrib, isha } as "HH:MM" strings.
// CalculationMethod angles: MWL (18/17), ISNA (15/15), Egypt (19.5/17.5), Makkah (18.5/90min)
const CALC_METHOD_ANGLES = {
  MWL:    { fajrAngle: 18,   ishaAngle: 17   },
  ISNA:   { fajrAngle: 15,   ishaAngle: 15   },
  Egypt:  { fajrAngle: 19.5, ishaAngle: 17.5 },
  Makkah: { fajrAngle: 18.5, ishaAngle: 17   },
};

function calcPrayerTimes(date, lat, lon, method = 'MWL', madhab = 'Shafi') {
  const { fajrAngle, ishaAngle } = CALC_METHOD_ANGLES[method] || CALC_METHOD_ANGLES.MWL;
  const JD = julianDate(date);
  const D = JD - 2451545.0;
  const g = (357.529 + 0.98560028 * D) % 360;
  const q = (280.459 + 0.98564736 * D) % 360;
  const L = (q + 1.915 * Math.sin(g * Math.PI / 180) + 0.020 * Math.sin(2 * g * Math.PI / 180)) % 360;
  const e = 23.439 - 0.00000036 * D;
  const RA = Math.atan2(
    Math.cos(e * Math.PI / 180) * Math.sin(L * Math.PI / 180),
    Math.cos(L * Math.PI / 180)
  ) * 180 / Math.PI / 15;
  const decl = Math.asin(Math.sin(e * Math.PI / 180) * Math.sin(L * Math.PI / 180)) * 180 / Math.PI;
  const EqT = q / 15 - ((RA + 360) % 24);
  const transit = 12 - EqT - lon / 15;

  const toRad = x => x * Math.PI / 180;
  const hourAngle = (angle) => {
    const cosH = (Math.sin(toRad(angle)) - Math.sin(toRad(lat)) * Math.sin(toRad(decl)))
      / (Math.cos(toRad(lat)) * Math.cos(toRad(decl)));
    if (Math.abs(cosH) > 1) return null;
    return Math.acos(cosH) * 180 / Math.PI / 15;
  };

  const fmtTime = (h) => {
    if (h === null) return '--:--';
    const total = ((h % 24) + 24) % 24;
    const hh = Math.floor(total);
    const mm = Math.floor((total - hh) * 60);
    return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  };

  // Asr shadow factor: Shafi = 1, Hanafi = 2
  const asrFactor = madhab === 'Hanafi' ? 2 : 1;
  const asrElevation = Math.atan(asrFactor + Math.tan(toRad(Math.abs(lat - decl)))) * 180 / Math.PI;

  const H_fajr    = hourAngle(-fajrAngle);
  const H_sunrise = hourAngle(-0.833);
  const H_asr     = hourAngle(90 - asrElevation);
  const H_maghrib = hourAngle(-0.833);
  const H_isha    = hourAngle(-ishaAngle);

  return {
    fajr:    fmtTime(transit - H_fajr),
    shurkuk: fmtTime(transit - H_sunrise),
    dhuhr:   fmtTime(transit + 0.033),
    asr:     fmtTime(transit + H_asr),
    maghrib: fmtTime(transit + H_maghrib),
    isha:    fmtTime(transit + H_isha),
  };
}

// ── Time helpers ─────────────────────────────────────────────────────────────
function toMinutes(timeStr) {
  if (!timeStr || timeStr === '--:--') return -1;
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

// Returns the key of the currently active prayer from a PrayerSchedule
function currentPrayerKey(schedule) {
  const order = ['fajr', 'shurkuk', 'dhuhr', 'asr', 'maghrib', 'isha'];
  const now = nowMinutes();
  let current = 'isha';
  for (let i = order.length - 1; i >= 0; i--) {
    const t = toMinutes(schedule[order[i]]);
    if (t !== -1 && now >= t) { current = order[i]; break; }
  }
  return current;
}

// Returns { name, time, minsRemaining, tomorrow } for the next prayer
function nextPrayerInfo(schedule) {
  const order = ['fajr', 'shurkuk', 'dhuhr', 'asr', 'maghrib', 'isha'];
  const now = nowMinutes();
  for (const p of order) {
    const t = toMinutes(schedule[p]);
    if (t !== -1 && now < t) return { name: p, time: schedule[p], minsRemaining: t - now, tomorrow: false };
  }
  // After Isha → next is tomorrow's Fajr (approx using today's Fajr time)
  const fajrT = toMinutes(schedule.fajr);
  const mins = fajrT === -1 ? 0 : (24 * 60 - now) + fajrT;
  return { name: 'fajr', time: schedule.fajr, minsRemaining: mins, tomorrow: true };
}

// Returns info about the prayer period currently in effect, plus what's next.
// Shurkuk (sunrise) is a time marker, not a prayer period — between Shurkuk
// and Dhuhr we treat the "current" state as a waiting window with no active prayer.
// Returns:
//   { active: false, waitingFor: { name, time, minsRemaining } }  — no prayer in effect
//   { active: true,  name, startTime, endTime, minsUntilEnd,
//                    next: { name, time, tomorrow } }              — prayer in effect
function currentPrayerInfo(schedule) {
  // Only real prayers, not Shurkuk
  const prayers = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
  const now = nowMinutes();

  // Find most-recent prayer whose start time has passed today
  let activeKey = null;
  for (let i = prayers.length - 1; i >= 0; i--) {
    const t = toMinutes(schedule[prayers[i]]);
    if (t !== -1 && now >= t) { activeKey = prayers[i]; break; }
  }

  // Before Fajr today — no prayer active (technically Isha from yesterday,
  // but without yesterday's schedule we present it as "waiting for Fajr")
  if (!activeKey) {
    const fajrT = toMinutes(schedule.fajr);
    return {
      active: false,
      waitingFor: { name: 'fajr', time: schedule.fajr, minsRemaining: fajrT === -1 ? 0 : fajrT - now },
    };
  }

  // Between Fajr and Shurkuk → Fajr is active, ends at Shurkuk
  // Between Shurkuk and Dhuhr → no prayer active (sunrise window)
  // Between Dhuhr/Asr/Maghrib/Isha → that prayer is active
  if (activeKey === 'fajr') {
    const shurkukT = toMinutes(schedule.shurkuk);
    const dhuhrT   = toMinutes(schedule.dhuhr);
    if (shurkukT !== -1 && now >= shurkukT) {
      // Past sunrise — Fajr period has closed
      return {
        active: false,
        waitingFor: { name: 'dhuhr', time: schedule.dhuhr, minsRemaining: dhuhrT === -1 ? 0 : dhuhrT - now },
      };
    }
    return {
      active: true,
      name: 'fajr',
      startTime: schedule.fajr,
      endTime: schedule.shurkuk,
      minsUntilEnd: shurkukT === -1 ? 0 : shurkukT - now,
      next: { name: 'dhuhr', time: schedule.dhuhr, tomorrow: false },
    };
  }

  // Active is dhuhr | asr | maghrib | isha
  const next = nextPrayerInfo(schedule);
  return {
    active: true,
    name: activeKey,
    startTime: schedule[activeKey],
    endTime: next.time,
    minsUntilEnd: next.minsRemaining,
    next: { name: next.name, time: next.time, tomorrow: next.tomorrow },
  };
}

function formatRemainingTime(mins) {
  if (mins <= 0) return 'Now';
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h > 0) return `${h}h ${m}m remaining`;
  return `${m}m remaining`;
}

function formatDisplayDate(date) {
  return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Hijri conversion (Kuwaiti algorithm) ─────────────────────────────────────
const HIJRI_MONTHS = [
  'Muharram', 'Safar', "Rabi' al-Awwal", "Rabi' al-Thani",
  'Jumada al-Awwal', 'Jumada al-Thani', 'Rajab', "Sha'ban",
  'Ramadan', 'Shawwal', "Dhu al-Qi'dah", 'Dhu al-Hijjah',
];

function toHijri(date) {
  const jd = julianDate(date);
  const l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  const l2 = l - 10631 * n + 354;
  const j = Math.floor((10985 - l2) / 5316) * Math.floor((50 * l2) / 17719)
    + Math.floor(l2 / 5670) * Math.floor((43 * l2) / 15238);
  const l3 = l2 - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50)
    - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  const month = Math.floor((24 * (l3 + 1)) / 709);
  const day = l3 - Math.floor((709 * month) / 24);
  return { day, month: HIJRI_MONTHS[month - 1], year: 30 * n + j - 30 };
}

// ── Qibla bearing from a lat/lon ──────────────────────────────────────────────
// Returns bearing in degrees (0–360, clockwise from North)
function calcQiblaBearing(lat, lon) {
  const KAABA_LAT = 21.4225;
  const KAABA_LON = 39.8262;
  const toRad = x => x * Math.PI / 180;
  const toDeg = x => x * 180 / Math.PI;
  const dLon = toRad(KAABA_LON - lon);
  const lat1 = toRad(lat);
  const lat2 = toRad(KAABA_LAT);
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// Expose to window for cross-module use
Object.assign(window, {
  julianDate,
  calcPrayerTimes,
  toMinutes,
  nowMinutes,
  currentPrayerKey,
  nextPrayerInfo,
  currentPrayerInfo,
  formatRemainingTime,
  formatDisplayDate,
  toHijri,
  HIJRI_MONTHS,
  calcQiblaBearing,
  CALC_METHOD_ANGLES,
});
</script>
<script type="text/babel">// lib/storage.jsx
// Persistence helpers for Sweden Prayer.
// Wraps localStorage so the rest of the app never calls localStorage directly.
// Cache entries carry a timestamp; callers can show "Updated N minutes ago."
// In production (React Native), these would wrap AsyncStorage.

const STORAGE_KEYS = {
  SCHEDULE_CACHE:   'sp:schedule_cache',
  SELECTED_CITY:    'sp:selected_city',
  RECENT_CITIES:    'sp:recent_cities',
  REMINDER_SETTINGS:'sp:reminder_settings',
};

// ── Schedule cache ────────────────────────────────────────────────────────────
// Key: "<cityName>:<YYYY-MM-DD>"
function scheduleCacheKey(cityName, date) {
  const iso = date.toISOString().slice(0, 10);
  return `${STORAGE_KEYS.SCHEDULE_CACHE}:${cityName}:${iso}`;
}

function saveSchedule(cityName, date, schedule) {
  try {
    const entry = { schedule, cachedAt: new Date().toISOString() };
    localStorage.setItem(scheduleCacheKey(cityName, date), JSON.stringify(entry));
  } catch (_) { /* storage full or unavailable — fail silently */ }
}

function loadSchedule(cityName, date) {
  try {
    const raw = localStorage.getItem(scheduleCacheKey(cityName, date));
    if (!raw) return null;
    return JSON.parse(raw); // { schedule, cachedAt }
  } catch (_) { return null; }
}

function clearScheduleCache() {
  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(STORAGE_KEYS.SCHEDULE_CACHE)) toRemove.push(k);
  }
  toRemove.forEach(k => localStorage.removeItem(k));
}

// ── Selected city ────────────────────────────────────────────────────────────
function saveSelectedCity(city) {
  try { localStorage.setItem(STORAGE_KEYS.SELECTED_CITY, JSON.stringify(city)); } catch (_) {}
}

function loadSelectedCity() {
  try {
    const raw = localStorage.getItem(STORAGE_KEYS.SELECTED_CITY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

// ── Recent cities (max 5) ────────────────────────────────────────────────────
function saveRecentCities(cities) {
  try { localStorage.setItem(STORAGE_KEYS.RECENT_CITIES, JSON.stringify(cities.slice(0, 5))); } catch (_) {}
}

function loadRecentCities() {
  try {
    const raw = localStorage.getItem(STORAGE_KEYS.RECENT_CITIES);
    return raw ? JSON.parse(raw) : [];
  } catch (_) { return []; }
}

function addRecentCity(city, existing) {
  const filtered = (existing || []).filter(c => c.name !== city.name);
  return [city, ...filtered].slice(0, 5);
}

// ── Reminder settings ────────────────────────────────────────────────────────
const DEFAULT_REMINDER_SETTINGS = {
  globalEnabled: true,
  prayers: {
    fajr:    { enabled: true,  type: 'adhan+15m' },
    shurkuk: { enabled: false, type: 'silent'    },
    dhuhr:   { enabled: true,  type: 'adhan'     },
    asr:     { enabled: true,  type: 'adhan'     },
    maghrib: { enabled: true,  type: 'adhan+10m' },
    isha:    { enabled: false,  type: 'silent'   },
  },
};

function saveReminderSettings(settings) {
  try { localStorage.setItem(STORAGE_KEYS.REMINDER_SETTINGS, JSON.stringify(settings)); } catch (_) {}
}

function loadReminderSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEYS.REMINDER_SETTINGS);
    return raw ? JSON.parse(raw) : DEFAULT_REMINDER_SETTINGS;
  } catch (_) { return DEFAULT_REMINDER_SETTINGS; }
}

Object.assign(window, {
  STORAGE_KEYS,
  saveSchedule, loadSchedule, clearScheduleCache,
  saveSelectedCity, loadSelectedCity,
  saveRecentCities, loadRecentCities, addRecentCity,
  DEFAULT_REMINDER_SETTINGS, saveReminderSettings, loadReminderSettings,
});
</script>

<script type="text/babel">// features/location/types.jsx
// Domain types and constants for the location feature.

// Full list of supported Swedish cities with coordinates.
// Sorted by population (largest first) for default display order.
const SWEDISH_CITIES = [
  { name: 'Stockholm',   lat: 59.3293, lon: 18.0686 },
  { name: 'Gothenburg',  lat: 57.7089, lon: 11.9746 },
  { name: 'Malmö',       lat: 55.6049, lon: 13.0038 },
  { name: 'Uppsala',     lat: 59.8586, lon: 17.6389 },
  { name: 'Västerås',    lat: 59.6099, lon: 16.5448 },
  { name: 'Örebro',      lat: 59.2753, lon: 15.2134 },
  { name: 'Linköping',   lat: 58.4108, lon: 15.6214 },
  { name: 'Helsingborg', lat: 56.0465, lon: 12.6945 },
  { name: 'Jönköping',   lat: 57.7826, lon: 14.1618 },
  { name: 'Norrköping',  lat: 58.5877, lon: 16.1924 },
  { name: 'Lund',        lat: 55.7047, lon: 13.1910 },
  { name: 'Umeå',        lat: 63.8258, lon: 20.2630 },
  { name: 'Gävle',       lat: 60.6749, lon: 17.1413 },
  { name: 'Borås',       lat: 57.7210, lon: 12.9401 },
  { name: 'Sundsvall',   lat: 62.3908, lon: 17.3069 },
  { name: 'Eskilstuna',  lat: 59.3710, lon: 16.5077 },
  { name: 'Södertälje',  lat: 59.1955, lon: 17.6253 },
  { name: 'Karlstad',    lat: 59.4022, lon: 13.5115 },
  { name: 'Växjö',       lat: 56.8777, lon: 14.8091 },
  { name: 'Halmstad',    lat: 56.6745, lon: 12.8578 },
];

// Popular cities shown as quick-select chips on the Location screen
const POPULAR_CITIES = ['Uppsala', 'Västerås', 'Örebro', 'Linköping', 'Helsingborg', 'Jönköping', 'Lund'];

// Default city (Stockholm) used before location is resolved
const DEFAULT_CITY = SWEDISH_CITIES[0];

// Find the nearest city to a lat/lon using Euclidean distance (good enough for Sweden's size)
function findNearestCity(lat, lon) {
  let nearest = SWEDISH_CITIES[0];
  let minDist = Infinity;
  for (const city of SWEDISH_CITIES) {
    const dist = Math.sqrt(Math.pow(city.lat - lat, 2) + Math.pow(city.lon - lon, 2));
    if (dist < minDist) { minDist = dist; nearest = city; }
  }
  return nearest;
}

Object.assign(window, {
  SWEDISH_CITIES,
  POPULAR_CITIES,
  DEFAULT_CITY,
  findNearestCity,
});
</script>
<script type="text/babel">// features/schedule/hooks.jsx
// useSchedule — loads and caches prayer times for a city + date.
// Exposes { schedule, loading, error, cachedAt, refresh }
// Follows the hook contract from ARCHITECTURE.md:
//   - never calls fetch directly (uses lib/time.jsx for calculation)
//   - integrates with lib/storage.jsx for caching
//   - always returns cached data while revalidating

// Prayer time calculation uses MWL (Muslim World League) angles and Shafi madhab by default.
// These are hardcoded; configurable via API integration in a future update.
const DEFAULT_CALC_METHOD = 'MWL';
const DEFAULT_MADHAB = 'Shafi';

function useSchedule(city, date) {
  const [schedule, setSchedule] = React.useState(null);
  const [loading, setLoading]   = React.useState(true);
  const [error, setError]       = React.useState(null);
  const [cachedAt, setCachedAt] = React.useState(null);

  const load = React.useCallback(() => {
    if (!city || !date) return;
    setLoading(true);
    setError(null);

    // 1. Try cache first — show immediately if present
    const cached = loadSchedule(city.name, date);
    if (cached) {
      setSchedule(cached.schedule);
      setCachedAt(cached.cachedAt);
      setLoading(false);
    }

    // 2. Compute (or recompute) times — in production this would be an API call
    //    via lib/api/aladhan.ts; here we use the local astronomical calculation.
    try {
      const computed = calcPrayerTimes(date, city.lat, city.lon, DEFAULT_CALC_METHOD, DEFAULT_MADHAB);
      setSchedule(computed);
      const now = new Date().toISOString();
      setCachedAt(now);
      saveSchedule(city.name, date, computed);
      setError(null);
    } catch (err) {
      if (!cached) setError('Could not calculate prayer times.');
      // If we have cached data, keep showing it silently
    } finally {
      setLoading(false);
    }
  }, [city && city.name, date && date.toDateString()]);

  React.useEffect(() => { load(); }, [load]);

  return { schedule, loading, error, cachedAt, refresh: load };
}

Object.assign(window, { useSchedule });
</script>
<script type="text/babel">// features/location/hooks.jsx
// useLocation — manages selected city, recent cities, and geolocation detection.
// Exposes { city, recentCities, detecting, error, selectCity, detectLocation }

function useLocation() {
  const [city, setCity] = React.useState(() => loadSelectedCity() || DEFAULT_CITY);
  const [recentCities, setRecentCities] = React.useState(() => {
    const stored = loadRecentCities();
    // Always ensure current city is in recents
    return stored.length ? stored : [DEFAULT_CITY];
  });
  const [detecting, setDetecting] = React.useState(false);
  const [error, setError] = React.useState(null);

  const selectCity = React.useCallback((newCity) => {
    setCity(newCity);
    saveSelectedCity(newCity);
    setRecentCities(prev => {
      const updated = addRecentCity(newCity, prev);
      saveRecentCities(updated);
      return updated;
    });
  }, []);

  const detectLocation = React.useCallback(() => {
    if (!navigator.geolocation) {
      setError('Geolocation not supported on this device.');
      return;
    }
    setDetecting(true);
    setError(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const nearest = findNearestCity(pos.coords.latitude, pos.coords.longitude);
        selectCity(nearest);
        setDetecting(false);
      },
      (_err) => {
        // Fallback: simulate detection with Stockholm for the prototype
        setTimeout(() => {
          selectCity(DEFAULT_CITY);
          setDetecting(false);
        }, 1200);
      },
      { timeout: 8000 }
    );
  }, [selectCity]);

  return { city, recentCities, detecting, error, selectCity, detectLocation };
}

Object.assign(window, { useLocation });
</script>
<script type="text/babel">// features/reminders/hooks.jsx
// useReminders — manages per-prayer notification settings.
// Exposes { settings, setGlobal, setPrayerEnabled, setPrayerType, clearCache }
// In production this schedules local notifications via lib/notifications/.

function useReminders() {
  const [settings, setSettings] = React.useState(() => loadReminderSettings());

  const persist = React.useCallback((updated) => {
    setSettings(updated);
    saveReminderSettings(updated);
  }, []);

  const setGlobal = React.useCallback((enabled) => {
    persist({ ...settings, globalEnabled: enabled });
  }, [settings, persist]);

  const setPrayerEnabled = React.useCallback((prayerKey, enabled) => {
    persist({
      ...settings,
      prayers: {
        ...settings.prayers,
        [prayerKey]: { ...settings.prayers[prayerKey], enabled },
      },
    });
  }, [settings, persist]);

  const setPrayerType = React.useCallback((prayerKey, type) => {
    persist({
      ...settings,
      prayers: {
        ...settings.prayers,
        [prayerKey]: { ...settings.prayers[prayerKey], type },
      },
    });
  }, [settings, persist]);

  return { settings, setGlobal, setPrayerEnabled, setPrayerType };
}

Object.assign(window, { useReminders });
</script>

  // Highlight the active prayer in the list — only when there's an active prayer
  // (not during the sunrise / pre-Fajr waiting windows)
  const activeListKey = cur && cur.active ? cur.name : null;

  // Progress through the current prayer period (0–1)
  const progress = (() => {
    if (!cur || !cur.active) return 0;
    const startM = toMinutes(cur.startTime);

    const total = endM > startM ? endM - startM : (24 * 60 - startM) + endM;
    const elapsed = total - cur.minsUntilEnd;
    return Math.max(0, Math.min(1, elapsed / total));

        <div style={{ margin: '8px 16px 12px', background: T.card, borderRadius: 18, padding: '14px 18px', boxShadow: '0 2px 16px rgba(0,0,0,0.06)', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: -24, right: -24, width: 100, height: 100, borderRadius: '50%', background: T.primaryLight, opacity: 0.55 }}></div>
          <div style={{ position: 'relative', display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 12 }}>
            <div>
              <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: 1.5, color: T.textSub, textTransform: 'uppercase', marginBottom: 4 }}>Prayer Schedule</div>
              <div style={{ fontFamily: 'Lora, serif', fontSize: 32, fontWeight: 700, color: T.primary, lineHeight: 1, marginBottom: 2 }}>
                {PRAYER_LABELS.fajr}
              </div>
              <div style={{ fontSize: 20, fontWeight: 500, color: T.text, letterSpacing: '-0.4px' }}>{schedule.fajr}</div>
            </div>
          </div>
        </div>
      )}

      {/* ── Loading / Error states ── */}
      {loading && !schedule && (
        <div style={{ textAlign: 'center', padding: '32px 20px', color: T.textSub, fontSize: 13 }}>
          Calculating prayer times…
        </div>
      )}
      {error && !schedule && (
        <div style={{ margin: '0 20px 16px', background: '#fff3f3', borderRadius: 12, padding: '12px 16px', fontSize: 13, color: '#c0392b' }}>
          {error}
        </div>
      )}

      {/* ── Prayer List (compact) ── */}
      {schedule && (
        <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 7 }}>
          {PRAYER_ORDER.map(p => {
            const isCurrent = isToday && p === activeListKey;
            const nowMins   = nowMinutes();
            const pMins     = toMinutes(schedule[p]);
            const isPassed  = isToday && pMins !== -1 && pMins < nowMins && !isCurrent;
            const notifOn   = reminderSettings.prayers[p]?.enabled ?? false;

            return (
              <div key={p} style={{
                background: isCurrent ? T.currentRow : T.card,
                borderRadius: 13,
                padding: '11px 14px',
                display: 'flex', alignItems: 'center', gap: 12,
                boxShadow: isCurrent ? `0 2px 12px ${T.accent}20` : '0 1px 4px rgba(0,0,0,0.05)',
                borderLeft: isCurrent ? `3px solid ${T.currentBorder}` : '3px solid transparent',
                opacity: isPassed ? 0.55 : 1,
                transition: 'all 0.2s',
              }}>
                <IconCircle bg={isCurrent ? T.accent + '22' : T.primaryLight} size={34} radius={10}>
                  <PrayerIcon name={p} size={17} color={isCurrent ? T.accent : T.primary} />
                </IconCircle>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontSize: 15, fontWeight: 600, color: T.text }}>{PRAYER_LABELS[p]}</span>
                    {isCurrent && <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: T.accent, textTransform: 'uppercase' }}>· Now</span>}
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <NotifBell
                    enabled={notifOn}
                    onToggle={() => onToggleReminder(p)}
                    color={isCurrent ? T.accent : T.primary}
                  />
                  <div style={{ fontSize: 16, fontWeight: 600, color: isCurrent ? T.accent : T.text, letterSpacing: '-0.3px', minWidth: 44, textAlign: 'right' }}>
                    {schedule[p]}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

Object.assign(window, { PrayerScreen });
</script>
<script type="text/babel">
function App() {
  const theme = 'sage';
  const T = THEMES[theme];
  const [date, setDate] = React.useState(new Date());
  const { city } = useLocation();
  const { settings: reminderSettings, setPrayerEnabled } = useReminders();
  return (
    <div className="phone-shell">
      <div className="status-bar" style={{ color: T.text }}>
        <div className="notch"></div>
        <span>9:41</span>
        <span style={{ fontSize: 12, opacity: 0.6 }}>•••</span>
      </div>
      <div className="screen-content" style={{ background: T.bg }}>
        <PrayerScreen theme={theme} city={city} date={date} setDate={setDate}
          onCityPress={() => {}}
          reminderSettings={reminderSettings}
          onToggleReminder={(k) => setPrayerEnabled(k, !(reminderSettings.prayers[k]?.enabled ?? false))} />
      </div>
      <div className="tab-bar"></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
